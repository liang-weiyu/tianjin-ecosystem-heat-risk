[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tianjin-ecosystem-heat-risk"
version = "0.1.0"
description = "Reproducible spatial and machine-learning analysis of ecosystem heat risk in Tianjin"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

